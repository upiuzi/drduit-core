# Dr Duit — Docker Compose
#
# Quickstart:
#   docker compose up -d
#
# Builds the Docker image locally and starts the Dr Duit container.
# App is available at http://localhost:8080 (or your server's IP:8080).
#
# Default password on fresh install: drduit
# To set a custom password, run:
#   AUTH_PASSWORD='your-strong-password' docker compose up -d
# or place AUTH_PASSWORD=... in a .env file next to this file.
#
# Data persists in the named volume `drduit-data`.
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: drduit:latest
    container_name: drduit
    ports:
      - "${PORT:-8080}:8080"
    environment:
      AUTH_PASSWORD: ${AUTH_PASSWORD:-drduit}
    volumes:
      - drduit-data:/home/drduit/.drduit
      - drduit-codex:/home/drduit/.codex
      - drduit-claude:/home/drduit/.claude
      - drduit-opencode:/home/drduit/.local/share/opencode
      # To share existing subscription CLI logins from host:
      # - ${HOME}/.claude/.credentials.json:/home/drduit/.claude/.credentials.json
      # - ${HOME}/.codex/auth.json:/home/drduit/.codex/auth.json
      # - ${HOME}/.local/share/opencode/auth.json:/home/drduit/.local/share/opencode/auth.json
    restart: unless-stopped

volumes:
  drduit-data:
    name: drduit-data
  drduit-codex:
    name: drduit-codex
  drduit-claude:
    name: drduit-claude
  drduit-opencode:
    name: drduit-opencode
